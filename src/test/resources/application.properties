spring.application.name=desafio01

# Habilitar Flyway
spring.flyway.enabled=false

spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.open-in-view=false

# Configuracao do Hibernate (apaga e recria tabelas a cada teste)
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

notify.api.url=https://jsonplaceholder.typicode.com

#jwt
# Test-only JWT secret key. Do not reuse in production.
jwt.secret.key=TEST_ONLY_jwt_secret_key_7a9f9c8b4e2d4c1f9b6a3d0f1c2e3b4a

# Kafka - disabled in tests (no broker available)
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
